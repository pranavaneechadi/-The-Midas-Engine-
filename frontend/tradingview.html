<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trade - TradingView</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://s3.tradingview.com/tv.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const containerId = 'tv_chart_container';
      const urlParams = new URLSearchParams(window.location.search);

      const normalizeSymbol = (raw) => {
        if (!raw) return 'NSE:SBIN';
        const trimmed = raw.trim().toUpperCase();
        if (trimmed.endsWith('.NS')) {
          return 'NSE:' + trimmed.replace('.NS', '');
        }
        if (/^[A-Z]+:[A-Z0-9.-]+$/.test(trimmed)) {
          return trimmed; // already EXCHANGE:SYMBOL
        }
        return trimmed; // e.g., AAPL
      };

      const symbolParam = urlParams.get('symbol') || 'SBIN.NS';
      const tvSymbol = normalizeSymbol(symbolParam);

      const setCurrentSymbol = () => {
        const el = document.getElementById('current-symbol');
        if (el) el.textContent = tvSymbol;
      };

      const initWidget = () => {
        if (!window.TradingView) {
          setTimeout(initWidget, 100);
          return;
        }
        new TradingView.widget({
          autosize: true,
          symbol: tvSymbol,
          interval: 'D',
          timezone: 'Etc/UTC',
          theme: 'dark',
          style: '1',
          locale: 'en',
          toolbar_bg: '#0f172a',
          enable_publishing: false,
          hide_top_toolbar: false,
          hide_legend: false,
          container_id: containerId,
          withdateranges: true,
          allow_symbol_change: true,
          studies: ['MACD@tv-basicstudies','RSI@tv-basicstudies'],
          overrides: {
            'paneProperties.background': '#0f172a',
            'paneProperties.vertGridProperties.color': '#1f2937',
            'paneProperties.horzGridProperties.color': '#1f2937',
            'scalesProperties.textColor': '#9ca3af',
            'scalesProperties.backgroundColor': '#0f172a',
            'mainSeriesProperties.candleStyle.upColor': '#34d399',
            'mainSeriesProperties.candleStyle.downColor': '#f87171',
            'mainSeriesProperties.candleStyle.drawWick': true,
            'mainSeriesProperties.candleStyle.wickUpColor': '#34d399',
            'mainSeriesProperties.candleStyle.wickDownColor': '#f87171',
            'mainSeriesProperties.candleStyle.borderUpColor': '#34d399',
            'mainSeriesProperties.candleStyle.borderDownColor': '#f87171'
          }
        });
      };

      setCurrentSymbol();
      initWidget();

      document.getElementById('btn_logout')?.addEventListener('click', () => {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        window.location.href = 'login.html';
      });

      document.getElementById('symbol-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const s = document.getElementById('symbol-input').value.trim();
        if (s) window.location.search = '?symbol=' + encodeURIComponent(s);
      });
    });
  </script>
</head>
<body>
  <div class="login-animated-bg" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>
  <div id="app" style="display:block;">
    <header>
      <h1>🪙 The Midas Engine 📈</h1>
      <button id="btn_logout">Logout</button>
    </header>

    <section class="slider">
      <form id="symbol-form" style="display:flex; gap:8px;">
        <input id="symbol-input" type="text" placeholder="Enter symbol e.g. SBIN.NS or AAPL" />
        <button type="submit">Load</button>
      </form>
      <p style="margin:8px 0;">Viewing: <strong id="current-symbol"></strong></p>
    </section>

    <section>
      <div id="tv_chart_container" style="width:100%; height:600px;"></div>
    </section>
  </div>
</body>
</html>
